<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인원체크</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- ================= 1. 참석자 입력 화면 (기본 첫 화면) ================= -->
  <div id="guestView" class="max-w-md mx-auto bg-white min-h-screen shadow-lg p-6">
    <div class="text-center mb-6 pt-2">
      <span class="inline-block bg-blue-50 text-blue-600 text-xs font-bold px-3 py-1 rounded-full mb-2">WELCOME</span>
      <h1 class="text-2xl font-bold text-slate-900">가족 참석 인원 체크</h1>
      <p class="text-sm text-slate-500 mt-1">대표자 성함과 연령대별 참석 인원을 선택해 주세요.</p>
    </div>

    <form onsubmit="submitGuest(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">대표자 이름 <span class="text-red-500">*</span></label>
        <input type="text" id="repName" required placeholder="예: 홍길동" class="w-full border border-slate-300 rounded-xl px-4 py-3.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
        <!-- 어른 -->
        <div class="flex justify-between items-center py-2 border-b border-slate-200">
          <div>
            <p class="font-bold text-slate-800">어른</p>
            <p class="text-xs text-slate-400">성인 (대표자 본인 포함)</p>
          </div>
          <div class="flex items-center space-x-3">
            <button type="button" onclick="adjustCount('adult', -1)" class="w-10 h-10 rounded-full border border-slate-300 bg-white font-bold text-lg">-</button>
            <span id="cnt-adult" class="w-6 text-center font-bold text-lg">1</span>
            <button type="button" onclick="adjustCount('adult', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-lg">+</button>
          </div>
        </div>

        <!-- 고등학생 -->
        <div class="flex justify-between items-center py-2 border-b border-slate-200">
          <p class="font-bold text-slate-800">고등학생</p>
          <div class="flex items-center space-x-3">
            <button type="button" onclick="adjustCount('high', -1)" class="w-10 h-10 rounded-full border border-slate-300 bg-white font-bold text-lg">-</button>
            <span id="cnt-high" class="w-6 text-center font-bold text-lg">0</span>
            <button type="button" onclick="adjustCount('high', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-lg">+</button>
          </div>
        </div>

        <!-- 중학생 -->
        <div class="flex justify-between items-center py-2 border-b border-slate-200">
          <p class="font-bold text-slate-800">중학생</p>
          <div class="flex items-center space-x-3">
            <button type="button" onclick="adjustCount('middle', -1)" class="w-10 h-10 rounded-full border border-slate-300 bg-white font-bold text-lg">-</button>
            <span id="cnt-middle" class="w-6 text-center font-bold text-lg">0</span>
            <button type="button" onclick="adjustCount('middle', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-lg">+</button>
          </div>
        </div>

        <!-- 초등학생 -->
        <div class="flex justify-between items-center py-2 border-b border-slate-200">
          <p class="font-bold text-slate-800">초등학생</p>
          <div class="flex items-center space-x-3">
            <button type="button" onclick="adjustCount('elem', -1)" class="w-10 h-10 rounded-full border border-slate-300 bg-white font-bold text-lg">-</button>
            <span id="cnt-elem" class="w-6 text-center font-bold text-lg">0</span>
            <button type="button" onclick="adjustCount('elem', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-lg">+</button>
          </div>
        </div>

        <!-- 아동 -->
        <div class="flex justify-between items-center py-2">
          <div>
            <p class="font-bold text-slate-800">아동</p>
            <p class="text-xs text-slate-400">미취학 아동</p>
          </div>
          <div class="flex items-center space-x-3">
            <button type="button" onclick="adjustCount('child', -1)" class="w-10 h-10 rounded-full border border-slate-300 bg-white font-bold text-lg">-</button>
            <span id="cnt-child" class="w-6 text-center font-bold text-lg">0</span>
            <button type="button" onclick="adjustCount('child', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-lg">+</button>
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center bg-blue-50 px-4 py-3.5 rounded-xl border border-blue-100">
        <span class="font-bold text-blue-900">총 참석 인원</span>
        <span id="totalNum" class="text-xl font-extrabold text-blue-600">1명</span>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition text-base">
        참석 등록하기
      </button>
    </form>

    <div id="successMsg" class="hidden text-center py-16 space-y-4">
      <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
      <h2 class="text-xl font-bold text-slate-900">참석 체크가 완료되었습니다!</h2>
      <p class="text-sm text-slate-500">소중한 걸음 해주셔서 감사합니다.</p>
      <button onclick="location.reload()" class="mt-4 text-sm text-blue-600 underline font-semibold">추가 등록하기</button>
    </div>

    <!-- 하단 주최자 로그인 버튼 -->
    <div class="mt-12 text-center border-t pt-4">
      <button onclick="openHostLogin()" class="text-xs text-slate-400 hover:text-slate-600">주최자 관리자 로그인</button>
    </div>
  </div>


  <!-- ================= 2. 주최자 대시보드 화면 ================= -->
  <div id="hostView" class="hidden max-w-md mx-auto bg-white min-h-screen shadow-lg p-6">
    <div class="flex justify-between items-center mb-5 border-b pb-3">
      <h1 class="text-xl font-bold text-slate-900">주최자 대시보드</h1>
      <button onclick="logoutHost()" class="text-xs bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-semibold">로그아웃</button>
    </div>

    <!-- QR 코드 영역 -->
    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center mb-6">
      <img id="qrImage" src="" alt="QR코드" onclick="toggleQrModal(true)" class="w-44 h-44 mx-auto bg-white p-2 border rounded-xl shadow-sm mb-2 cursor-pointer transition transform hover:scale-105" title="터치하면 확대됩니다">
      <p class="text-xs text-slate-400 mt-1">QR을 터치하면 크게 확대됩니다</p>
      <p class="text-xs text-slate-400 break-all mt-1" id="qrUrlText"></p>
      <button onclick="copyUrl()" class="mt-3 text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg font-semibold">참석 링크 복사</button>
    </div>

    <!-- 집계 현황판 -->
    <div class="mb-6">
      <div class="flex justify-between items-center mb-2.5">
        <span id="familyTotalCount" class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-bold">총 0가족</span>
        <button onclick="renderHost()" class="text-xs bg-slate-100 text-slate-700 border px-2.5 py-1 rounded-lg font-semibold">새로고침</button>
      </div>
      <div class="grid grid-cols-6 gap-1 text-center text-xs">
        <div class="bg-blue-600 text-white p-2 rounded-lg">
          <p class="opacity-80 scale-90">전체</p>
          <p id="sum-total" class="font-bold text-sm">0</p>
        </div>
        <div class="bg-slate-100 p-2 rounded-lg">
          <p class="text-slate-500 scale-90">어른</p>
          <p id="sum-adult" class="font-bold text-sm">0</p>
        </div>
        <div class="bg-slate-100 p-2 rounded-lg">
          <p class="text-slate-500 scale-90">고등</p>
          <p id="sum-high" class="font-bold text-sm">0</p>
        </div>
        <div class="bg-slate-100 p-2 rounded-lg">
          <p class="text-slate-500 scale-90">중등</p>
          <p id="sum-middle" class="font-bold text-sm">0</p>
        </div>
        <div class="bg-slate-100 p-2 rounded-lg">
          <p class="text-slate-500 scale-90">초등</p>
          <p id="sum-elem" class="font-bold text-sm">0</p>
        </div>
        <div class="bg-slate-100 p-2 rounded-lg">
          <p class="text-slate-500 scale-90">아동</p>
          <p id="sum-child" class="font-bold text-sm">0</p>
        </div>
      </div>
    </div>

    <!-- 명단 리스트 -->
    <div>
      <div class="flex justify-between items-center mb-2.5">
        <h2 class="font-bold text-base">가족별 등록 명단</h2>
        <button onclick="clearData()" class="text-xs text-red-600 bg-red-50 border border-red-200 px-2.5 py-1 rounded-lg font-semibold">전체 초기화</button>
      </div>
      <div id="guestList" class="space-y-2 text-sm"></div>
    </div>
  </div>

  <!-- QR 확대 모달 창 -->
  <div id="qrModal" onclick="toggleQrModal(false)" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6">
    <div onclick="event.stopPropagation()" class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4">
      <h3 class="text-xl font-bold text-slate-900">가족 참석 체크 QR코드</h3>
      <p class="text-xs text-slate-500">스마트폰 기본 카메라로 스캔해 주세요.</p>
      <img id="qrModalImage" src="" alt="확대 QR코드" class="w-64 h-64 mx-auto border p-2 rounded-2xl bg-white shadow-inner">
      <button onclick="toggleQrModal(false)" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-sm">닫기</button>
    </div>
  </div>


  <script>
    const counts = { adult: 1, high: 0, middle: 0, elem: 0, child: 0 };
    const STORAGE_KEY = 'family_attendance_sync_v4';
    const HOST_PW = '000407';

    window.onload = () => {
      document.getElementById('guestView').classList.remove('hidden');
      document.getElementById('hostView').classList.add('hidden');
    };

    function adjustCount(type, delta) {
      counts[type] = Math.max(0, counts[type] + delta);
      document.getElementById(`cnt-${type}`).innerText = counts[type];
      const total = counts.adult + counts.high + counts.middle + counts.elem + counts.child;
      document.getElementById('totalNum').innerText = total + '명';
    }

    function submitGuest(e) {
      e.preventDefault();
      const name = document.getElementById('repName').value.trim();
      const total = counts.adult + counts.high + counts.middle + counts.elem + counts.child;
      if (!name) return alert('대표자 이름을 입력해 주세요.');
      if (total === 0) return alert('참석 인원을 1명 이상 선택해 주세요.');

      const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      list.unshift({
        id: Date.now(),
        name,
        adult: counts.adult,
        high: counts.high,
        middle: counts.middle,
        elem: counts.elem,
        child: counts.child,
        total,
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));

      document.getElementById('guestView').querySelector('form').classList.add('hidden');
      document.getElementById('successMsg').classList.remove('hidden');
    }

    function openHostLogin() {
      const pw = prompt('주최자 비밀번호를 입력하세요:');
      if (pw === HOST_PW) {
        document.getElementById('guestView').classList.add('hidden');
        document.getElementById('hostView').classList.remove('hidden');
        
        const currentUrl = window.location.href.split('?')[0];
        const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(currentUrl)}`;
        document.getElementById('qrImage').src = qrSrc;
        document.getElementById('qrModalImage').src = qrSrc;
        document.getElementById('qrUrlText').innerText = currentUrl;
        
        renderHost();
      } else if (pw !== null) {
        alert('비밀번호가 틀렸습니다.');
      }
    }

    function logoutHost() {
      document.getElementById('hostView').classList.add('hidden');
      document.getElementById('guestView').classList.remove('hidden');
    }

    function renderHost() {
      const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      document.getElementById('familyTotalCount').innerText = `총 ${list.length}가족`;

      const sums = list.reduce((acc, cur) => {
        acc.total += Number(cur.total) || 0;
        acc.adult += Number(cur.adult) || 0;
        acc.high += Number(cur.high) || 0;
        acc.middle += Number(cur.middle) || 0;
        acc.elem += Number(cur.elem) || 0;
        acc.child += Number(cur.child) || 0;
        return acc;
      }, { total: 0, adult: 0, high: 0, middle: 0, elem: 0, child: 0 });

      ['total', 'adult', 'high', 'middle', 'elem', 'child'].forEach(k => {
        document.getElementById(`sum-${k}`).innerText = sums[k];
      });

      const container = document.getElementById('guestList');
      if (list.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 py-10">아직 등록된 참석자가 없습니다.</p>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-slate-900">${item.name} 가족</span>
              <span class="text-xs text-slate-400">${item.time}</span>
            </div>
            <p class="text-xs text-slate-600 mt-1">
              어른 <b>${item.adult || 0}</b> · 고등 <b>${item.high || 0}</b> · 중등 <b>${item.middle || 0}</b> · 초등 <b>${item.elem || 0}</b> · 아동 <b>${item.child || 0}</b>
            </p>
          </div>
          <span class="bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-lg text-xs">${item.total}명</span>
        </div>
      `).join('');
    }

    function toggleQrModal(show) {
      const modal = document.getElementById('qrModal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function copyUrl() {
      const currentUrl = window.location.href.split('?')[0];
      navigator.clipboard.writeText(currentUrl).then(() => {
        alert('참석자용 링크가 복사되었습니다!');
      });
    }

    function clearData() {
      if (confirm('모든 참석 기록을 초기화하시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderHost();
      }
    }
  </script>
</body>
</html>
